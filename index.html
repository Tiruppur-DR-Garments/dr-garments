<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR Garments - Wholesale Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9182b;
      --accent: #f59e0b;
      --bg: #0f1117;
      --surface: #181b24;
      --surface-card: #202430;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3446;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 4rem; }
    
    header {
      background: rgba(24, 27, 36, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text-main); }
    
    .brand-logo-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      border: 1.5px solid #f59e0b;
      background: #000;
    }

    .brand-text h1 { font-size: 1.15rem; font-weight: 800; }
    .brand-text p { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-badge {
      background: rgba(201, 24, 43, 0.15);
      border: 1px solid var(--primary);
      color: #fca5a5;
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero { text-align: center; padding: 2rem 1rem 1rem; max-width: 800px; margin: 0 auto; }
    .hero h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.4rem; color: #fff; }
    .hero p { color: var(--text-muted); font-size: 0.92rem; }

    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .img-box {
      width: 100%;
      height: 380px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.65rem; flex-grow: 1; }
    .code-badge {
      display: inline-block; align-self: flex-start;
      background: rgba(245, 158, 11, 0.15); color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-weight: 800; font-size: 0.82rem; padding: 0.2rem 0.6rem; border-radius: 6px;
    }
    .product-title { font-size: 1.05rem; font-weight: 700; color: #fff; line-height: 1.35; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; }
    .price { font-size: 1.4rem; font-weight: 800; color: #4ade80; }
    .moq { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; }
    .specs-table { width: 100%; border-collapse: collapse; margin-top: 0.2rem; font-size: 0.85rem; }
    .specs-table td { padding: 0.3rem 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .specs-table td:first-child { color: var(--text-muted); width: 32%; }
    .specs-table td:last-child { color: #fff; font-weight: 600; }
    
    .btn-enquiry {
      margin-top: auto;
      background: var(--whatsapp);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
