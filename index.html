<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR Garments - Wholesale Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9182b;
      --accent: #f59e0b;
      --bg: #0f1117;
      --surface: #181b24;
      --surface-card: #202430;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3446;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 5rem; }
    
    header {
      background: rgba(24, 27, 36, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
    }
    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text-main); }
    
    /* Clean, Bold DR Emblem Logo */
    .brand-logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      background: radial-gradient(circle, #0f172a 0%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-logo-wrap svg { width: 100%; height: 100%; }

    .brand-text h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.3px; }
    .brand-text p { font-size: 0.72rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-badge {
      background: rgba(201, 24, 43, 0.15);
      border: 1px solid var(--primary);
      color: #fca5a5;
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .container { max-width: 520px; margin: 1.5rem auto; padding: 0 1rem; }

    /* Login Modal Popup */
    .login-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-modal.active { display: flex; }
    .login-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 1.5rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
    }
    .login-card h3 { color: var(--accent); margin-bottom: 0.8rem; font-size: 1.2rem; }
    .login-card input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .login-btn-row { display: flex; gap: 0.6rem; }
    .login-btn-row button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-submit-pass { background: #2563eb; color: #fff; }
    .btn-cancel-pass { background: #374151; color: #fff; }

    /* Manager Form Box */
    .manager-box {
      display: none;
      background: var(--surface);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 2rem;
    }
    .manager-box.active { display: block; }
    .manager-box h3 { color: var(--accent); font-size: 1.15rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 0.25rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .form-grid input, .manager-box input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    .file-row {
      margin: 0.8rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(0,0,0,0.3);
      padding: 0.8rem;
      border-radius: 8px;
    }
    .file-row label { font-size: 0.78rem; color: var(--accent); font-weight: 700; }
    .file-row input[type="file"] { font-size: 0.8rem; color: #cbd5e1; }
    .btn-add {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Product Card */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-item {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    .slide-item.active { display: flex; }
    .slide-item img, .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 5;
    }
    .slider-btn.prev { left: 10px; }
    .slider-btn.next { right: 10px; }
    .slide-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-body { padding: 1.3rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .top-meta { display: flex; justify-content: space-between; align-items: center; }
    .code-badge {
      background: rgba(245, 158, 11, 0.15); color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-weight: 800; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 6px;
    }
    .btn-remove {
      display: none;
      background: #ef4444; color: #fff; border: none;
      padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer;
    }
    .btn-remove.active { display: inline-block; }
    .product-title { font-size: 1.25rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; }
    .price { font-size: 1.5rem; font-weight: 800; color: #4ade80; }
    .moq { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .specs-table { width: 100%; border-collapse: collapse; margin-top: 0.2rem; font-size: 0.88rem; }
    .specs-table td { padding: 0.35rem 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .specs-table td:first-child { color: var(--text-muted); width: 35%; }
    .specs-table td:last-child { color: #fff; font-weight: 600; }
    
    .btn-enquiry {
      margin-top: 0.5rem;
      background: var(--whatsapp);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .btn-admin-login {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <!-- Crystal Clear 'DR' Gold & Blue Logo -->
        <div class="brand-logo-wrap">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fde047" />
                <stop offset="100%" stop-color="#d97706" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="3" fill="none" />
            <text x="21" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#38bdf8">D</text>
            <text x="50" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)">R</text>
          </svg>
        </div>
        <div class="brand-text">
          <h1>DR Garments</h1>
          <p>Tiruppur Wholesale</p>
        </div>
      </a>
      <div class="header-badge">Wholesale Only • Minimum Order Applies</div>
    </div>
  </header>

  <!-- Login Modal Popup -->
  <div class="login-modal" id="loginModal">
    <div class="login-card">
      <h3>Admin Access</h3>
      <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:1rem;">Enter password to manage catalogue:</p>
      <input type="password" id="passInput" placeholder="Password">
      <div class="login-btn-row">
        <button class="btn-cancel-pass" onclick="closeLoginModal()">Cancel</button>
        <button class="btn-submit-pass" onclick="verifyPassword()">Login</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- Admin Manager Panel -->
    <div class="manager-box" id="managerBox">
      <h3>
        <span>+ Add Product (Admin Mode)</span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
      </h3>
      <div class="form-grid">
        <input type="text" id="inpCode" placeholder="Code (e.g. 529)">
        <input type="text" id="inpPrice" placeholder="Price (e.g. ₹299 / Piece)">
        <input type="text" id="inpSizes" placeholder="Sizes (e.g. S / M / L / XL / XXL)">
        <input type="text" id="inpMoq" placeholder="MOQ (e.g. 100 Pieces)">
        <input type="text" id="inpColours" placeholder="Colours (e.g. 24 Colours)">
        <input type="text" id="inpFabric" placeholder="Fabric (e.g. MARS FABRIC)">
      </div>
      <input type="text" id="inpTitle" placeholder="Product Title" style="margin-bottom: 0.8rem;">

      <div class="file-row">
        <div>
          <label>Select up to 5 Photos from Phone</label>
          <input type="file" id="inpPhotos" accept="image/*" multiple>
        </div>
        <div>
          <label>Select 1 Video from Phone</label>
          <input type="file" id="inpVideo" accept="video/*">
        </div>
      </div>

      <button class="btn-add" onclick="addProduct()">+ Add Product to Catalogue</button>
    </div>

    <!-- Product Display List -->
    <div id="catalogueList"></div>
  </div>

  <footer>
    <p>DR Garments • Tiruppur Wholesale</p>
    <button class="btn-admin-login" onclick="openLoginModal()">🔒 Admin Login</button>
  </footer>

  <script>
    const ADMIN_KEY = "Sg0808";
    let isAdminLoggedIn = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      setTimeout(() => { openLoginModal(); }, 300);
    }

    const BASE_RAW = "https://raw.githubusercontent.com/Tiruppur-DR-Garments/dr-garments/main/";

    const defaultCatalogue = [
      {
        id: "prod_529",
        code: "529",
        title: "Mens Polo T-Shirt (Premium Look)",
        price: "₹299 / Piece",
        moq: "100 Pieces",
        sizes: "S / M / L / XL / XXL",
        colours: "24 Colours",
        fabric: "MARS FABRIC",
        slides: [
          { type: 'image', src: BASE_RAW + 'file_000000005fc48211a35e4afa06ff0ee3.jpg' },
          { type: 'image', src: BASE_RAW + 'file_0000000079f482088cca7a1c72f7fb54.jpg' },
          { type: 'image', src: BASE_RAW + 'file_000000002d648211b5a369fe4e222955.jpg' },
          { type: 'image', src: BASE_RAW + 'file_00000000126c820881662ca393c52a37.jpg' },
          { type: 'video', src: BASE_RAW + 'AhaConvert_1791545754_q5iYt87g89g8e6d0a790510daea67280.mp4' }
        ]
      }
    ];

    let catalogueData = JSON.parse(localStorage.getItem('dr_saved_products')) || defaultCatalogue;

    function openLoginModal() {
      document.getElementById('loginModal').classList.add('active');
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function verifyPassword() {
      const p = document.getElementById('passInput').value;
      if (p === ADMIN_KEY) {
        isAdminLoggedIn = true;
        closeLoginModal();
        document.getElementById('managerBox').classList.add('active');
        renderCards();
      } else {
        alert("Incorrect password!");
      }
    }

    function adminLogout() {
      isAdminLoggedIn = false;
      document.getElementById('managerBox').classList.remove('active');
      renderCards();
    }

    function renderCards() {
      const target = document.getElementById('catalogueList');
      target.innerHTML = '';

      catalogueData.forEach((item, pIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let slidesHtml = item.slides.map((s, sIdx) => {
          const activeClass = sIdx === 0 ? 'active' : '';
          if (s.type === 'video') {
            return `
              <div class="slide-item ${activeClass}">
                <video controls playsinline preload="metadata">
                  <source src="${s.src}" type="video/mp4">
                </video>
              </div>`;
          } else {
            return `
              <div class="slide-item ${activeClass}">
                <img src="${s.src}" alt="${item.title}">
              </div>`;
          }
        }).join('');

        const total = item.slides.length;
        const navHtml = total > 1 ? `
          <button class="slider-btn prev" onclick="moveSlide(${pIdx}, -1)">&#10094;</button>
          <button class="slider-btn next" onclick="moveSlide(${pIdx}, 1)">&#10095;</button>
          <div class="slide-counter" id="counter-${pIdx}">1 / ${total}</div>
        ` : '';

        const removeBtnClass = isAdminLoggedIn ? 'btn-remove active' : 'btn-remove';
        const waUrl = "https://wa.me/919965655991?text=" + encodeURIComponent(`Hello DR Garments, enquiry for Code: ${item.code} (${item.title})`);

        card.innerHTML = `
          <div class="slider-container" id="slider-${pIdx}">
            ${slidesHtml}
            ${navHtml}
          </div>
          <div class="card-body">
            <div class="top-meta">
              <span class="code-badge">Code: ${item.code}</span>
              <button class="${removeBtnClass}" onclick="removeCard('${item.id}')">Remove</button>
            </div>
            <h3 class="product-title">${item.title}</h3>
            <div class="price-row">
              <span class="price">${item.price}</span>
              <span class="moq">Min: ${item.moq}</span>
            </div>
            <table class="specs-table">
              <tr><td>Sizes</td><td>${item.sizes}</td></tr>
              <tr><td>Colours</td><td>${item.colours}</td></tr>
              <tr><td>Fabric</td><td>${item.fabric}</td></tr>
            </table>
            <a href="${waUrl}" target="_blank" class="btn-enquiry">WhatsApp Enquiry</a>
          </div>
        `;
        target.appendChild(card);
      });
    }

    function moveSlide(pIdx, step) {
      const box = document.getElementById(`slider-${pIdx}`);
      const slides = box.querySelectorAll('.slide-item');
      let current = 0;
      slides.forEach((s, idx) => { if (s.classList.contains('active')) current = idx; });
      slides[current].classList.remove('active');
      const curVid = slides[current].querySelector('video');
      if (curVid) curVid.pause();

      let next = (current + step + slides.length) % slides.length;
      slides[next].classList.add('active');
      document.getElementById(`counter-${pIdx}`).textContent = `${next + 1} / ${slides.length}`;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    async function addProduct() {
      const code = document.getElementById('inpCode').value;
      const title = document.getElementById('inpTitle').value;
      const price = document.getElementById('inpPrice').value;
      const moq = document.getElementById('inpMoq').value;
      const sizes = document.getElementById('inpSizes').value;
      const colours = document.getElementById('inpColours').value;
      const fabric = document.getElementById('inpFabric').value;

      if (!code || !title) {
        alert("Please enter Product Code and Title!");
        return;
      }

      const pFiles = document.getElementById('inpPhotos').files;
      const vFiles = document.getElementById('inpVideo').files;

      let newSlides = [];

      for (let i = 0; i < Math.min(pFiles.length, 5); i++) {
        const b64 = await fileToDataUrl(pFiles[i]);
        newSlides.push({ type: 'image', src: b64 });
      }

      if (vFiles.length > 0) {
        const vidB64 = await fileToDataUrl(vFiles[0]);
        newSlides.push({ type: 'video', src: vidB64 });
      }

      const newProduct = {
        id: "p_" + Date.now(),
        code, title, price, moq, sizes, colours, fabric,
        slides: newSlides
      };

      catalogueData.unshift(newProduct);
      try {
        localStorage.setItem('dr_saved_products', JSON.stringify(catalogueData));
      } catch (e) {}

      renderCards();
      alert("Product added successfully!");

      document.getElementById('inpCode').value = '';
      document.getElementById('inpTitle').value = '';
      document.getElementById('inpPrice').value = '';
      document.getElementById('inpSizes').value = '';
      document.getElementById('inpMoq').value = '';
      document.getElementById('inpColours').value = '';
      document.getElementById('inpFabric').value = '';
      document.getElementById('inpPhotos').value = '';
      document.getElementById('inpVideo').value = '';
    }

    function removeCard(id) {
      if (confirm("Remove this product?")) {
        catalogueData = catalogueData.filter(x => x.id !== id);
        try {
          localStorage.setItem('dr_saved_products', JSON.stringify(catalogueData));
        } catch (e) {}
        renderCards();
      }
    }

    renderCards();
  </script>
</body>
</html>
