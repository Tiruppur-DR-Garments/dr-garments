<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR Garments - Wholesale Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9182b;
      --accent: #f59e0b;
      --bg: #0f1117;
      --surface: #181b24;
      --surface-card: #202430;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3446;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 5rem; }
    
    header {
      background: rgba(24, 27, 36, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
    }
    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text-main); }
    .brand-logo {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 42px; height: 42px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem; color: #fff;
    }
    .brand-text h1 { font-size: 1.15rem; font-weight: 800; }
    .brand-text p { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; }

    .container { max-width: 520px; margin: 1.5rem auto; padding: 0 1rem; }

    /* Manager Form */
    .manager-box {
      background: var(--surface);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 2rem;
    }
    .manager-box h3 { color: var(--accent); font-size: 1.1rem; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .form-grid input, .manager-box input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    .file-row {
      margin: 0.8rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(0,0,0,0.3);
      padding: 0.8rem;
      border-radius: 8px;
    }
    .file-row label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .file-row input[type="file"] { font-size: 0.8rem; color: #cbd5e1; }
    .btn-add {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Product Card */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-item {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    .slide-item.active { display: flex; }
    .slide-item img, .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 5;
    }
    .slider-btn.prev { left: 10px; }
    .slider-btn.next { right: 10px; }
    .slide-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-body { padding: 1.3rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .top-meta { display: flex; justify-content: space-between; align-items: center; }
    .code-badge {
      background: rgba(245, 158, 11, 0.15); color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-weight: 800; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 6px;
    }
    .btn-remove {
      background: #ef4444; color: #fff; border: none;
      padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer;
    }
    .product-title { font-size: 1.2rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; }
    .price { font-size: 1.45rem; font-weight: 800; color: #4ade80; }
    .moq { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .specs-table { width: 100%; border-collapse: collapse; margin-top: 0.2rem; font-size: 0.88rem; }
    .specs-table td { padding: 0.35rem 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .specs-table td:first-child { color: var(--text-muted); width: 35%; }
    .specs-table td:last-child { color: #fff; font-weight: 600; }
    
    .btn-enquiry {
      margin-top: 0.4rem;
      background: var(--whatsapp);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <div class="brand-logo">DR</div>
        <div class="brand-text">
          <h1>DR Garments</h1>
          <p>Tiruppur Wholesale</p>
        </div>
      </a>
      <span style="font-size: 0.8rem; color: var(--accent); font-weight: 700;">MANAGER PANEL</span>
    </div>
  </header>

  <div class="container">
    <!-- Add / Edit Manager Panel -->
    <div class="manager-box">
      <h3>+ Add / Manage Product</h3>
      <div class="form-grid">
        <input type="text" id="inpCode" placeholder="Code" value="529">
        <input type="text" id="inpPrice" placeholder="Price" value="₹299 / Piece">
        <input type="text" id="inpSizes" placeholder="Sizes" value="S / M / L / XL / XXL">
        <input type="text" id="inpMoq" placeholder="MOQ" value="100 Pieces">
        <input type="text" id="inpColours" placeholder="Colours" value="24 Colours">
        <input type="text" id="inpFabric" placeholder="Fabric" value="MARS FABRIC">
      </div>
      <input type="text" id="inpTitle" placeholder="Product Title" value="Mens Polo T-Shirt (Premium Look)" style="margin-bottom: 0.8rem;">

      <div class="file-row">
        <div>
          <label>Select up to 5 Photos from Phone</label>
          <input type="file" id="inpPhotos" accept="image/*" multiple>
        </div>
        <div>
          <label>Select 1 Video from Phone</label>
          <input type="file" id="inpVideo" accept="video/*">
        </div>
      </div>

      <button class="btn-add" onclick="addProduct()">+ Add Product to Catalogue</button>
    </div>

    <!-- Product Display List -->
    <div id="catalogueList"></div>
  </div>

  <script>
    // Initial Code-529 product setup with local/repo fallback files
    let catalogueData = [
      {
        id: "prod_529",
        code: "529",
        title: "Mens Polo T-Shirt (Premium Look)",
        price: "₹299 / Piece",
        moq: "100 Pieces",
        sizes: "S / M / L / XL / XXL",
        colours: "24 Colours",
        fabric: "MARS FABRIC",
        slides: [
          { type: 'image', src: '1002372112.png', fallback: 'file_000000005fc48211a35e4afa06ff0ee3.jpg' },
          { type: 'image', src: '1002372104.png', fallback: 'file_0000000079f482088cca7a1c72f7fb54.jpg' },
          { type: 'image', src: '1002372113.png', fallback: 'file_000000002d648211b5a369fe4e222955.jpg' },
          { type: 'image', src: '1002372114.png', fallback: 'file_00000000126c820881662ca393c52a37.jpg' },
          { type: 'video', src: 'AhaConvert_1791545754_q5iYt87g89g8e6d0a790510daea67280.mp4' }
        ]
      }
    ];

    function renderCards() {
      const target = document.getElementById('catalogueList');
      target.innerHTML = '';

      catalogueData.forEach((item, pIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let slidesHtml = item.slides.map((s, sIdx) => {
          const activeClass = sIdx === 0 ? 'active' : '';
          if (s.type === 'video') {
            return `
              <div class="slide-item ${activeClass}">
                <video controls playsinline preload="metadata">
                  <source src="${s.src}" type="video/mp4">
                  <source src="./${s.src}" type="video/mp4">
                </video>
              </div>`;
          } else {
            const fallbackAttr = s.fallback ? `onerror="if(!this.dataset.fallback){this.dataset.fallback=true;this.src='${s.fallback}';}"` : `onerror="this.src='./${s.src}'"`;
            return `
              <div class="slide-item ${activeClass}">
                <img src="${s.src}" ${fallbackAttr} alt="${item.title}">
              </div>`;
          }
        }).join('');

        const total = item.slides.length;
        const navHtml = total > 1 ? `
          <button class="slider-btn prev" onclick="moveSlide(${pIdx}, -1)">&#10094;</button>
          <button class="slider-btn next" onclick="moveSlide(${pIdx}, 1)">&#10095;</button>
          <div class="slide-counter" id="counter-${pIdx}">1 / ${total}</div>
        ` : '';

        const waUrl = "https://wa.me/919965655991?text=" + encodeURIComponent(`Hello DR Garments, enquiry for Code: ${item.code} (${item.title})`);

        card.innerHTML = `
          <div class="slider-container" id="slider-${pIdx}">
            ${slidesHtml}
            ${navHtml}
          </div>
          <div class="card-body">
            <div class="top-meta">
              <span class="code-badge">Code: ${item.code}</span>
              <button class="btn-remove" onclick="removeCard('${item.id}')">Remove</button>
            </div>
            <h3 class="product-title">${item.title}</h3>
            <div class="price-row">
              <span class="price">${item.price}</span>
              <span class="moq">Min Order: ${item.moq}</span>
            </div>
            <table class="specs-table">
              <tr><td>Sizes</td><td>${item.sizes}</td></tr>
              <tr><td>Colours</td><td>${item.colours}</td></tr>
              <tr><td>Fabric</td><td>${item.fabric}</td></tr>
            </table>
            <a href="${waUrl}" target="_blank" class="btn-enquiry">WhatsApp Enquiry</a>
          </div>
        `;
        target.appendChild(card);
      });
    }

    function moveSlide(pIdx, step) {
      const box = document.getElementById(`slider-${pIdx}`);
      const slides = box.querySelectorAll('.slide-item');
      let current = 0;
      slides.forEach((s, idx) => { if (s.classList.contains('active')) current = idx; });
      slides[current].classList.remove('active');
      const curVid = slides[current].querySelector('video');
      if (curVid) curVid.pause();

      let next = (current + step + slides.length) % slides.length;
      slides[next].classList.add('active');
      document.getElementById(`counter-${pIdx}`).textContent = `${next + 1} / ${slides.length}`;
    }

    function addProduct() {
      const code = document.getElementById('inpCode').value;
      const title = document.getElementById('inpTitle').value;
      const price = document.getElementById('inpPrice').value;
      const moq = document.getElementById('inpMoq').value;
      const sizes = document.getElementById('inpSizes').value;
      const colours = document.getElementById('inpColours').value;
      const fabric = document.getElementById('inpFabric').value;

      const pFiles = document.getElementById('inpPhotos').files;
      const vFiles = document.getElementById('inpVideo').files;

      let newSlides = [];

      for (let i = 0; i < Math.min(pFiles.length, 5); i++) {
        newSlides.push({ type: 'image', src: URL.createObjectURL(pFiles[i]) });
      }

      if (vFiles.length > 0) {
        newSlides.push({ type: 'video', src: URL.createObjectURL(vFiles[0]) });
      }

      if (newSlides.length === 0) {
        newSlides = catalogueData[0].slides;
      }

      const newProduct = {
        id: "p_" + Date.now(),
        code, title, price, moq, sizes, colours, fabric,
        slides: newSlides
      };

      catalogueData.unshift(newProduct);
      renderCards();
      alert("Product added successfully!");
    }

    function removeCard(id) {
      if (confirm("Remove this product?")) {
        catalogueData = catalogueData.filter(x => x.id !== id);
        renderCards();
      }
    }

    renderCards();
  </script>
</body>
</html>
