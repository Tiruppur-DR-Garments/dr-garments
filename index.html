<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR Garments - Wholesale Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9182b;
      --accent: #f59e0b;
      --bg: #0f1117;
      --surface: #181b24;
      --surface-card: #202430;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2e3446;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); line-height: 1.5; padding-bottom: 4rem; }
    
    header {
      background: rgba(24, 27, 36, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
    }
    .nav-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text-main); }
    .brand-logo {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 42px; height: 42px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem; color: #fff;
    }
    .brand-text h1 { font-size: 1.15rem; font-weight: 800; }
    .brand-text p { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; }

    .container { max-width: 520px; margin: 1.5rem auto; padding: 0 1rem; }

    /* Manager Form Box */
    .manager-box {
      background: var(--surface);
      border: 1px dashed var(--accent);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 2rem;
    }
    .manager-box h3 { color: var(--accent); font-size: 1.1rem; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .form-grid input, .manager-box input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
    }
    .file-row {
      margin: 0.8rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(0,0,0,0.3);
      padding: 0.8rem;
      border-radius: 8px;
    }
    .file-row label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .file-row input[type="file"] { font-size: 0.8rem; color: #cbd5e1; }
    .btn-add {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Product Card */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-item {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    .slide-item.active { display: flex; }
    .slide-item img, .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 5;
    }
    .slider-btn.prev { left: 10px; }
    .slider-btn.next { right: 10px; }
    .slide-counter {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .card-body { padding: 1.3rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .top-meta { display: flex; justify-content: space-between; align-items: center; }
    .code-badge {
      background: rgba(245, 158, 11, 0.15); color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-weight: 800; font-size: 0.85rem; padding: 0.25rem 0.65rem; border-radius: 6px;
    }
    .btn-remove {
      background: #ef4444; color: #fff; border: none;
      padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem;
      font-weight: 700; cursor: pointer;
    }
    .product-title { font-size: 1.2rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; }
    .price { font-size: 1.45rem; font-weight: 800; color: #4ade80; }
    .moq { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .specs-table { width: 100%; border-collapse: collapse; margin-top: 0.2rem; font-size: 0.88rem; }
    .specs-table td { padding: 0.35rem 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .specs-table td:first-child { color: var(--text-muted); width: 35%; }
    .specs-table td:last-child { color: #fff; font-weight: 600; }
    
    .btn-enquiry {
      margin-top: 0.4rem;
      background: var(--whatsapp);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <div class="brand-logo">DR</div>
        <div class="brand-text">
          <h1>DR Garments</h1>
          <p>Tiruppur Wholesale</p>
        </div>
      </a>
      <span style="font-size: 0.8rem; color: var(--accent); font-weight: 700;">CATALOGUE MANAGER</span>
    </div>
  </header>

  <div class="container">
    <!-- Add / Edit Manager Panel -->
    <div class="manager-box">
      <h3>+ Add / Update Product</h3>
      <div class="form-grid">
        <input type="text" id="inpCode" placeholder="Code (e.g. 501)" value="501">
        <input type="text" id="inpPrice" placeholder="Price (e.g. ₹215 / Piece)" value="₹215 / Piece">
        <input type="text" id="inpSizes" placeholder="Sizes (e.g. L | XL | XXL)" value="L | XL | XXL">
        <input type="text" id="inpMoq" placeholder="MOQ (e.g. 100 Pieces)" value="100 Pieces">
        <input type="text" id="inpColours" placeholder="Colours (e.g. 5 Colours)" value="5 Colours">
        <input type="text" id="inpFabric" placeholder="Fabric (e.g. Cotton Knit)" value="Cotton Knit">
      </div>
      <input type="text" id="inpTitle" placeholder="Product Title" value="Ladies Nightwear Set – Top + Pant" style="margin-bottom: 0.8rem;">

      <div class="file-row">
        <div>
          <label>Select up to 5 Photos (from phone)</label>
          <input type="file" id="inpPhotos" accept="image/*" multiple>
        </div>
        <div>
          <label>Select 1 Video (from phone)</label>
          <input type="file" id="inpVideo" accept="video/*">
        </div>
      </div>

      <button class="btn-add" onclick="saveProduct()">+ Add to Catalogue</button>
    </div>

    <!-- Product Display Area -->
    <div id="catalogueList"></div>
  </div>

  <script>
    // Initial dummy data with root fallback
    const defaultData = [
      {
        id: "prod_1",
        code: "501",
        title: "Ladies Nightwear Set – Top + Pant",
        price: "₹215 / Piece",
        moq: "100 Pieces",
        sizes: "L | XL | XXL",
        colours: "5 Colours",
        fabric: "Cotton Knit",
        slides: [
          { type: 'image', src: 'FB_IMG_1791544846969.jpg' },
          { type: 'image', src: 'FB_IMG_1791544849680.jpg' },
          { type: 'image', src: 'FB_IMG_1791544851819.jpg' },
          { type: 'image', src: 'FB_IMG_1791544853695.jpg' },
          { type: 'image', src: 'FB_IMG_1791544856267.jpg' },
          { type: 'video', src: 'AhaConvert_1791545754_q5iYt87g89g8e6d0a790510daea67280.mp4' }
        ]
      }
    ];

    let items = JSON.parse(localStorage.getItem('dr_items')) || defaultData;

    function renderCatalogue() {
      const target = document.getElementById('catalogueList');
      target.innerHTML = '';

      items.forEach((p, pIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let slidesMarkup = p.slides.map((s, sIdx) => {
          const activeClass = sIdx === 0 ? 'active' : '';
          if (s.type === 'video') {
            return `
              <div class="slide-item ${activeClass}">
                <video controls playsinline preload="metadata">
                  <source src="${s.src}" type="video/mp4">
                </video>
              </div>`;
          } else {
            return `
              <div class="slide-item ${activeClass}">
                <img src="${s.src}" onerror="this.src='./${s.src}'" alt="${p.title}">
              </div>`;
          }
        }).join('');

        const total = p.slides.length;
        const nav = total > 1 ? `
          <button class="slider-btn prev" onclick="moveSlide(${pIdx}, -1)">&#10094;</button>
          <button class="slider-btn next" onclick="moveSlide(${pIdx}, 1)">&#10095;</button>
          <div class="slide-counter" id="counter-${pIdx}">1 / ${total}</div>
        ` : '';

        const waUrl = "https://wa.me/919965655991?text=" + encodeURIComponent(`Hello DR Garments, enquiry for Code: ${p.code} (${p.title})`);

        card.innerHTML = `
          <div class="slider-container" id="slider-${pIdx}">
            ${slidesMarkup}
            ${nav}
          </div>
          <div class="card-body">
            <div class="top-meta">
              <span class="code-badge">Code: ${p.code}</span>
              <button class="btn-remove" onclick="deleteProduct('${p.id}')">Remove</button>
            </div>
            <h3 class="product-title">${p.title}</h3>
            <div class="price-row">
              <span class="price">${p.price}</span>
              <span class="moq">Min Order: ${p.moq}</span>
            </div>
            <table class="specs-table">
              <tr><td>Sizes</td><td>${p.sizes}</td></tr>
              <tr><td>Colours</td><td>${p.colours}</td></tr>
              <tr><td>Fabric</td><td>${p.fabric}</td></tr>
            </table>
            <a href="${waUrl}" target="_blank" class="btn-enquiry">WhatsApp Enquiry</a>
          </div>
        `;
        target.appendChild(card);
      });
    }

    function moveSlide(pIdx, step) {
      const box = document.getElementById(`slider-${pIdx}`);
      const slides = box.querySelectorAll('.slide-item');
      let cur = 0;
      slides.forEach((s, idx) => { if(s.classList.contains('active')) cur = idx; });
      slides[cur].classList.remove('active');
      const curVid = slides[cur].querySelector('video');
      if (curVid) curVid.pause();

      let next = (cur + step + slides.length) % slides.length;
      slides[next].classList.add('active');
      document.getElementById(`counter-${pIdx}`).textContent = `${next + 1} / ${slides.length}`;
    }

    function fileToData(file) {
      return new Promise((res) => {
        const reader = new FileReader();
        reader.onload = (e) => res(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    async function saveProduct() {
      const code = document.getElementById('inpCode').value;
      const title = document.getElementById('inpTitle').value;
      const price = document.getElementById('inpPrice').value;
      const moq = document.getElementById('inpMoq').value;
      const sizes = document.getElementById('inpSizes').value;
      const colours = document.getElementById('inpColours').value;
      const fabric = document.getElementById('inpFabric').value;

      const pFiles = document.getElementById('inpPhotos').files;
      const vFiles = document.getElementById('inpVideo').files;

      let slideList = [];

      for (let i = 0; i < Math.min(pFiles.length, 5); i++) {
        const url = await fileToData(pFiles[i]);
        slideList.push({ type: 'image', src: url });
      }

      if (vFiles.length > 0) {
        const vidUrl = await fileToData(vFiles[0]);
        slideList.push({ type: 'video', src: vidUrl });
      }

      if (slideList.length === 0) {
        slideList = defaultData[0].slides;
      }

      const item = {
        id: "p_" + Date.now(),
        code, title, price, moq, sizes, colours, fabric,
        slides: slideList
      };

      items.unshift(item);
      localStorage.setItem('dr_items', JSON.stringify(items));
      renderCatalogue();
      alert("Product added successfully!");
    }

    function deleteProduct(id) {
      if(confirm("Do you want to remove this product?")) {
        items = items.filter(x => x.id !== id);
        localStorage.setItem('dr_items', JSON.stringify(items));
        renderCatalogue();
      }
    }

    renderCatalogue();
  </script>
</body>
</html>
